name: Bug 报告 / Bug Report
description: 报告一个可复现的问题 / Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先**搜索[已有 Issue](https://github.com/wxfly515616-lab/FocusStack_v2/issues)**，避免重复。
        请尽量提供完整信息，便于定位问题。更多约定见 [CONTRIBUTING.md](https://github.com/wxfly515616-lab/FocusStack_v2/blob/main/CONTRIBUTING.md)。

        Thanks for reporting! Please **search [existing issues](https://github.com/wxfly515616-lab/FocusStack_v2/issues)** first.
        The more detail you provide, the faster we can help. See [CONTRIBUTING.md](https://github.com/wxfly515616-lab/FocusStack_v2/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 简明描述遇到的问题，以及发生问题的场景（拍摄合成 / 相册合成 / 保存 / 其他）。
      placeholder: |
        例如：点击「拍摄合成」后，App 在显示「正在合成」时闪退。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 一步步描述如何复现，越具体越好。
      placeholder: |
        1. 打开 App，对准桌面上的小物件
        2. 点击「拍摄合成」
        3. 等待约 5 秒
        4. App 闪退
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / Expected behavior
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual behavior
      description: 实际发生了什么？是否有报错信息？
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: 机型 / Device model
      description: 例如 小米 13、Pixel 7、华为 Mate 60
      placeholder: Pixel 7
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android 版本 / Android version
      placeholder: "Android 14（API 34）"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: FocusStack 版本 / App version
      description: 可在 App 内「帮助」页面或系统设置中查看，例如 2.0。
      placeholder: "2.0"
    validations:
      required: true

  - type: dropdown
    id: manual_focus
    attributes:
      label: 设备是否支持手动对焦 / Manual focus support
      description: 影响扫焦策略，请尽量确认。
      options:
        - 支持 / Supported
        - 不支持 / Not supported
        - 不确定 / Not sure
    validations:
      required: true

  - type: textarea
    id: logcat
    attributes:
      label: logcat 日志 / Logcat
      description: 请粘贴相关日志，建议过滤 tag：MainActivity、CameraController、FocusStacker。
      render: shell
      placeholder: |
        adb logcat -s MainActivity CameraController FocusStacker
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / Screenshots
      description: 可直接拖拽或粘贴图片，帮助说明界面异常。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我已搜索过已有 Issue，确认这不是重复问题 / I have searched existing issues and this is not a duplicate.
          required: true
        - label: 我已阅读贡献指南 / I have read CONTRIBUTING.md.
          required: true
